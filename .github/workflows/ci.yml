
name: CI/CD

# CI strategy:
# Push to develop/main/feature branches -> lint + unit tests
# Pull requests to develop/main -> lint + unit tests
#
# AWS integration tests and deployment jobs are temporarily disabled.
# They will be re-enabled after AWS OIDC configuration.

on:
  push:
    branches: [main, develop, "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Stage 1: Lint, format check, unit tests ────────────────────────────────
  # Runs on every PR and every push.
  # This remains the active CI quality gate.

  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive infra/

      - name: Terraform validate — s3 module
        run: terraform init -backend=false -input=false && terraform validate
        working-directory: infra/modules/s3

      - name: Terraform validate — sqs module
        run: terraform init -backend=false -input=false && terraform validate
        working-directory: infra/modules/sqs

      - name: Terraform validate — lambda module
        run: terraform init -backend=false -input=false && terraform validate
        working-directory: infra/modules/lambda

      - name: Terraform validate — dynamodb module
        run: terraform init -backend=false -input=false && terraform validate
        working-directory: infra/modules/dynamodb

      - name: Terraform validate — glue module
        run: terraform init -backend=false -input=false && terraform validate
        working-directory: infra/modules/glue

      - name: Terraform validate — iam module
        run: terraform init -backend=false -input=false && terraform validate
        working-directory: infra/modules/iam

      - name: Run unit tests with coverage
        run: pytest -m "not integration" --tb=short --cov --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ── Stage 2: Integration tests ─────────────────────────────────────────────
  # TEMPORARILY DISABLED:
  # Requires AWS OIDC authentication and real AWS resources.
  # Re-enable after configuring the IAM trust relationship.

  integration-test:
    name: Integration Tests (AWS dev)
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: ${{ false }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Run integration tests
        run: pytest -m integration --tb=short -q
        env:
          AWS_DEFAULT_REGION: us-east-1

  # ── Stage 3a: Deploy to dev ────────────────────────────────────────────────
  # TEMPORARILY DISABLED:
  # Requires AWS OIDC authentication.

  deploy-dev:
    name: Deploy → dev
    runs-on: ubuntu-latest
    needs: integration-test
    if: ${{ false }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Build Lambda artifact
        run: bash scripts/build_lambda.sh

      - name: Terraform init — dev
        run: terraform init -input=false
        working-directory: infra/environments/dev

      - name: Terraform apply — dev
        run: terraform apply -var-file=terraform.tfvars -auto-approve
        working-directory: infra/environments/dev

  # ── Stage 3b: Deploy to prod ───────────────────────────────────────────────
  # TEMPORARILY DISABLED:
  # Requires AWS OIDC authentication and production approval.

  deploy-prod:
    name: Deploy → prod
    runs-on: ubuntu-latest
    needs: integration-test
    if: ${{ false }}
    environment: production

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Build Lambda artifact
        run: bash scripts/build_lambda.sh

      - name: Terraform init — prod
        run: terraform init -input=false
        working-directory: infra/environments/prod

      - name: Terraform apply — prod
        run: terraform apply -var-file=terraform.tfvars -auto-approve
        working-directory: infra/environments/prod
